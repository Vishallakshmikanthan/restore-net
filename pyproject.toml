[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kla-image-restoration"
version = "1.0.0"
description = "RestoreNet: Degradation-Aware Fidelity-First Image Restoration for KLA SEMICON India Hackathon"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-image>=0.21.0",
    "lpips>=0.1.4",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "tensorboard>=2.14.0",
    "matplotlib>=3.7.0",
    "Pillow>=10.0.0",
]
