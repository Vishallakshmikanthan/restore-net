seed: 42
device: cuda
data_root: ./data
output_dir: ./results
checkpoint_dir: ./checkpoints
log_dir: ./logs

model:
  name: restorenet
  scale_factor: 2
  num_features: 64
  num_blocks: 10
  upsample_mode: pixel_shuffle
training:
  epochs: 150
  batch_size: 8
  learning_rate: 0.001
  optimizer: Adam
  betas: [0.9, 0.999]
  weight_decay: 0
  warmup_epochs: 5
  gradient_clip: 1.0
  scheduler:
    name: CosineAnnealingLR
    T_max: 150
    eta_min: 0.000001
loss:
  lambda_pixel: 1.0
  lambda_ssim: 0.3
  lambda_lpips: 0.1
  lambda_freq: 0.05
mixed_precision:
  enabled: true
data:
  train_ratio: 0.70
  val_ratio: 0.20
  include_synthetic: true
  synthetic_samples_per_image: 3
checkpointing:
  save_every_n_epochs: 5
  keep_last_n: 3
  best_metric: val_psnr
  patience: 20
logging:
  tensorboard: true
  log_every_n_batches: 50
