seed: 42
device: cuda
data_root: ./data
output_dir: ./results
checkpoint_dir: ./checkpoints
log_dir: ./logs

model:
  name: baseline
  scale_factor: 2
  num_features: 64
  num_blocks: 3
training:
  epochs: 50
  batch_size: 8
  learning_rate: 0.001
  loss: L1
  scheduler:
    name: CosineAnnealingLR
    T_max: 50
